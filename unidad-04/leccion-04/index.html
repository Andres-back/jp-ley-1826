<script type="application/json" id="contenido">{"formatoFuente": [], "comillasCursiva": true, "ilustraciones": "ilustraciones-ley", "paleta": {"marino": "#003F5E", "teal": "#30615B", "oxido": "#30615B", "coral": "#8CD147", "crema": "#FBFBC5", "niebla": "#E5F2F3", "hielo": "#FDFDE2", "celeste": "#E5F2F3", "madera": "#30615B", "piso": "#E5F2F3", "gris": "#D6E4E2", "amarillo": "#8CD147"}, "anclas": {"fundamento-documento.webp": {"r": 1.1613, "p": [[50, 15], [52, 37], [19, 41], [72, 34]]}, "clasificacion-carpetas.webp": {"r": 1.5177, "p": [[30, 80], [45, 80], [60, 82], [41, 47], [85, 58]]}, "captura-detenido.webp": {"r": 1.2894, "p": [[37, 28], [80, 32], [50, 84], [52, 57]]}, "terminos-reloj.webp": {"r": 1.833, "p": [[45, 60], [55, 12], [37, 23]]}, "investigacion-lupa.webp": {"r": 1.4019, "p": [[40, 12], [88, 14], [78, 32], [55, 72], [14, 82]]}, "sustentacion-audiencia.webp": {"r": 1.4241, "p": [[31, 46], [40, 32], [55, 65], [80, 45], [70, 24]]}, "entrega-carpeta.webp": {"r": 1.8293, "p": [[60, 22], [78, 30]]}, "revisan-documento.webp": {"r": 1.0896, "p": [[64, 30], [52, 34]]}, "dialogo-carpeta.webp": {"r": 1.1719, "p": [[78, 35], [50, 30]]}, "lee-libro-explica.webp": {"r": 1.1321, "p": [[30, 27], [46, 17], [73, 30]]}, "explica-brazos.webp": {"r": 1.3373, "p": [[78, 30], [54, 22], [12, 32]]}, "alto-documento.webp": {"r": 1.2987, "p": [[63, 25], [50, 17]]}, "trio-dialogo.webp": {"r": 1.4706, "p": [[82, 30], [38, 22], [55, 30]]}, "corren-carpetas.webp": {"r": 1.6854, "p": [[30, 25], [73, 27]]}}, "respiro": 370, "pagina": 481, "paginaLamina": 740, "claveVentana": 300, "tablaVentana": true, "juego": {"clave": "l1826-juego-u4-l4", "niveles": ["Observador", "Analista", "Fiscal del abreviado", "Referente en el procedimiento abreviado"]}, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "l1826", "partirComas": true, "bitacora": true, "rellenoHoja": true, "filaOpciones": 1, "retro": {"reacciones": ["p-alto-documento.webp", "p-explica-brazos.webp", "p-dialogo-carpeta.webp"], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": ["ley-d-choque.webp"], "rotulo": "Unidad 4 · Lección 4"}, "leccion_rotulo": "Lección 4", "unit": 4, "lesson": 4, "heading": "Lección 4: Mediación procedimiento y formatos", "scenes": [{"layout": "fichas", "segmentos": ["Objetivo de la lección: Analizar, gestionar e instrumentar el mecanismo de justicia restaurativa de la mediación penal dentro del procedimiento penal especial abreviado (Ley 1826 de 2017 y arts. 523 a 527 del CPP), dominando sus principios rectores (voluntariedad, información, confidencialidad y extinción de la acción penal), la secuencia procedimental de tramitación y el correcto diligenciamiento de los formatos oficiales institucionales de la FGN (FGN-MP02-F-131, F-132 y F-133), con el fin de propiciar la solución pacífica del conflicto, la reparación integral de la víctima y la asunción de responsabilidad del imputado sin incurrir en vicios de nulidad.", "La mediación penal representa un pilar sustancial de la justicia restaurativa moderna. Fue consagrada en la Ley 906 de 2004 y es aplicable directamente al procedimiento especial abreviado de la Ley 1826 de 2017 por remisión expresa del artículo 547 (justicia restaurativa). Consiste en un espacio dialogado de participación facilitada por un mediador neutral e imparcial designado por la FGN En este la persona indiciada o acusada y la víctima directa interactúan para construir soluciones integrales frente a las consecuencias del delito. El desarrollo y validez de la mediación penal está estrictamente condicionado por la observancia y control de los siguientes principios de orden constitucional y legal:"], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Objetivo de la lección", "segs": [0], "obj": "libros"}, {"label": "Introducción", "segs": [1], "obj": "personas"}]}], "rotulo": null, "seccion": "Lección 4: Mediación procedimiento y formatos", "grupo": null, "titulos_fuente": ["Lección 4: Mediación procedimiento y formatos", "Introducción"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Objetivo de la lección", "Introducción"], "titulo_genially": "Mediación procedimiento y formatos", "complemento_genially": "", "apartado": "", "bloques_fuente": [61, 63], "ilustracion": "dialogo-carpeta.webp"}, {"layout": "puntos", "segmentos": ["a) Voluntariedad: el inicio, permanencia y finalización del trámite de mediación penal está sujeto al libre albedrío y consentimiento expreso por escrito de ambas partes. Ni fiscales, jueces, ni mediadores pueden obligar a la víctima o a la persona procesada a participar en un proceso de mediación. Cualquiera de los intervinientes conserva la facultad de retractarse o abandonar el trámite en cualquier etapa sin sanción o consecuencia procesal adversa.", "b) Derecho a la información y asesoría jurídica: antes de firmar el consentimiento de inicio del trámite, las partes deben recibir información completa, clara y detallada sobre las implicaciones sustanciales de la mediación, la naturaleza del acuerdo, los compromisos restaurativos y el impacto directo que el cumplimiento de este tendrá sobre el ejercicio de la acción penal.", "c) Confidencialidad: de acuerdo con el artículo 525 del CPP, ninguna declaración, afirmación de responsabilidad, arrepentimiento u oferta económica efectuada por las partes en el curso de las sesiones de mediación penal podrá ser grabada, trasladada o utilizada en su contra como elemento de prueba en el proceso judicial ordinario ni en el juicio oral en caso de fracasar el mecanismo.", "d) Extinción de la acción penal: una vez finalizado el proceso de mediación, el mediador elaborará un informe con sus resultados y lo remitirá al fiscal o al juez, según corresponda. De conformidad con el artículo 526 de la Ley 906 de 2004, dichos resultados deberán ser valorados para determinar sus efectos en la actuación penal, así como su incidencia en el ejercicio de la acción penal, la selección de medidas de coerción personal y la individualización de la pena, cuando corresponda. La celebración de un acuerdo restaurativo y el cumplimiento de los compromisos asumidos no generan, por sí solos, la extinción de la acción penal ni obligan al fiscal a archivar las diligencias. Corresponde a la Fiscalía valorar el informe y determinar el curso de la actuación conforme al marco jurídico aplicable. Según las circunstancias del caso y siempre que se cumplan los requisitos legales, podrá considerar mecanismos como la aplicación del principio de oportunidad o solicitar la preclusión ante el juez competente cuando concurra una causal legal que la sustente. En todo caso, la mediación conserva sus efectos civiles vinculantes en los términos del artículo 526 del Código de Procedimiento Penal."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "a) Voluntariedad", "segs": [0], "obj": "personas"}, {"label": "b) Derecho a la información y asesoría jurídica", "segs": [1], "obj": "documento"}, {"label": "c) Confidencialidad", "segs": [2], "obj": "escudo"}, {"label": "d) Extinción de la acción penal", "segs": [3], "obj": "expediente"}]}], "rotulo": null, "seccion": "Introducción", "grupo": null, "titulos_fuente": ["Introducción"], "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["a) Voluntariedad", "b) Derecho a la información y asesoría jurídica", "c) Confidencialidad", "d) Extinción de la acción penal"], "titulo_genially": "Principios de orden constitucional y legal", "complemento_genially": "", "apartado": "Introducción", "bloques_fuente": [64, 67], "ilustracion": "fundamento-documento.webp"}, {"layout": "esquema", "segmentos": ["El trámite de mediación penal al interior del proceso de Investigación y Judicialización de la FGN (identificado bajo el código macro FGN-MP02) cuenta con una secuencia de formatos obligatorios y estandarizados diseñados para garantizar la legalidad, trazabilidad y debido proceso de las partes en conflicto. Los fiscales delegados y asistentes judiciales de la causa deben conocer de forma rigurosa cuándo se utiliza cada instrumento y cómo debe diligenciarse técnicamente:", "a. Formato FGN-MP02-F-131: formato de consentimiento informado para trámite de mediación penal: Este instrumento documenta la manifestación libre, voluntaria e informada de las partes para participar en el procedimiento de mediación. Su diligenciamiento requiere verificar que cada persona comprenda la finalidad del mecanismo, sus alcances, las condiciones de participación y las consecuencias jurídicas que pueden derivarse de sus resultados. También debe explicarse la posibilidad de no continuar con la mediación, de acuerdo con las reglas aplicables, así como el alcance de la confidencialidad.", "Ejemplo práctico: después de un incidente en el que una persona causa daños a la motocicleta de otra durante una discusión, ambas manifiestan interés en explorar una solución mediante mediación. Antes de iniciar el trámite, se debe informar a cada una sobre el propósito del mecanismo, verificar que su participación no obedezca a amenazas o presiones y documentar su consentimiento. Si una de ellas acepta únicamente porque teme represalias de la otra, no basta con obtener su firma: es necesario evaluar la libertad real de su decisión y la pertinencia de continuar con el procedimiento.", "b. Formato FGN-MP02-F-132: formato de remisión del conflicto a mediación penal: Este instrumento documenta la remisión del asunto por parte del fiscal competente al procedimiento de mediación. Debe diligenciarse con información suficiente para identificar la actuación, a las partes y los hechos objeto de remisión, así como para delimitar el conflicto que podrá abordarse en el espacio restaurativo, conforme a los requisitos del mecanismo y a las instrucciones institucionales vigentes.", "Ejemplo práctico: en el caso de los daños ocasionados a la motocicleta, el fiscal verifica previamente la procedencia de la mediación y remite el asunto mediante el formato correspondiente. En la descripción del conflicto se identifican los daños denunciados y las circunstancias relevantes, sin presentar como probados hechos que todavía son objeto de investigación. El objeto de la mediación puede orientarse a explorar la reparación del daño y los compromisos necesarios para atender sus consecuencias. Una remisión incompleta, que no permita identificar con claridad el asunto o a las personas involucradas, dificulta la preparación del encuentro y la trazabilidad del trámite.", "c. Formato FGN-MP02-F-133: formato de acta de acuerdo de mediación penal (resultado y cierre): Este instrumento permite documentar los resultados de la mediación cuando las partes alcanzan un acuerdo, de acuerdo con la finalidad y las instrucciones de diligenciamiento del formato institucional. Los compromisos deben consignarse de manera clara, expresa y verificable, indicando quién se obliga, qué debe hacer, a favor de quién, en qué plazo y en qué condiciones. También deben identificarse los mecanismos pertinentes para verificar su cumplimiento, respetando la voluntariedad de las partes y los límites legales de la mediación. Ejemplo práctico: durante la mediación por los daños a la motocicleta, las partes acuerdan que la persona responsable pagará $600.000 para cubrir parte de la reparación, en dos cuotas de $300.000, los días 15 y 30 de noviembre de 2026. El acta debe identificar a quien asume el compromiso, a quien recibirá el pago, las fechas y las condiciones acordadas. No sería suficiente registrar que la persona «se compromete a responder por los daños cuando tenga dinero», pues esta expresión no determina un plazo concreto ni permite verificar con precisión el cumplimiento.", "Si no se alcanza un acuerdo, debe dejarse constancia del resultado conforme al procedimiento y al instrumento institucional aplicable, sin inventar compromisos que las partes no aceptaron.", "Consideración final sobre los efectos jurídicos: los resultados de la mediación deben remitirse a la autoridad competente para su valoración, de conformidad con el artículo 526 de la Ley 906 de 2004. La celebración del acuerdo o el cumplimiento de sus compromisos no produce automáticamente el archivo de la actuación ni la preclusión de la investigación. La Fiscalía debe determinar el curso de la actuación conforme a las normas aplicables y a las circunstancias del caso."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7], "vineta": [], "lead": [0], "titulo": [], "tail": [7], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "a. Formato FGN-MP02-F-131", "segs": [1, 2], "obj": "documento"}, {"label": "b. Formato FGN-MP02-F-132", "segs": [3, 4], "obj": "carpetas"}, {"label": "c. Formato FGN-MP02-F-133", "segs": [5, 6], "obj": "expediente"}]}], "rotulo": "Formatos FGN-MP02-F-131, F-132 y F-133: aplicación y técnica de diligenciamiento", "seccion": "1. Formatos FGN-MP02-F-131, F-132 Y F-133: aplicación y técnica de diligenciamiento", "grupo": null, "titulos_fuente": ["1. Formatos FGN-MP02-F-131, F-132 Y F-133: aplicación y técnica de diligenciamiento"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["a. Formato FGN-MP02-F-131", "b. Formato FGN-MP02-F-132", "c. Formato FGN-MP02-F-133"], "titulo_genially": "Formatos FGN-MP02-F-131, F-132 y F-133: aplicación y técnica de diligenciamiento", "complemento_genially": "", "apartado": "1. Formatos FGN-MP02-F-131, F-132 Y F-133: aplicación y técnica de diligenciamiento", "bloques_fuente": [68, 76], "objeto_raiz": "libros", "objetos_raiz": ["libros", "escudo", "lupa"], "escenario": {"bioma": "sala", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "descargaMapa": {"archivo": "descargas/mapa-conceptual-formatos-mediacion.png", "nombre": "Mapa conceptual - Formatos FGN-MP02-F-131, F-132 y F-133 (Ley 1826 de 2017, U4 L4).png", "boton": "Clic para descargar el mapa"}}]}</script>
