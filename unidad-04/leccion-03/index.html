<script type="application/json" id="contenido">{"formatoFuente": [{"a": "ento unificado y la ", "t": "Guía para la intervención y conciliación", "d": " identificad", "f": "C"}, {"a": "a) ", "t": "Cuando se concreta un acuerdo conciliatorio (resultado favorable)", "d": ": se redacta", "f": "N"}, {"a": "b) ", "t": "Cuando no hay acuerdo (resultado desfavorable):", "d": " si las part", "f": "N"}], "comillasCursiva": true, "ilustraciones": "ilustraciones-ley", "paleta": {"marino": "#003F5E", "teal": "#30615B", "oxido": "#30615B", "coral": "#8CD147", "crema": "#FBFBC5", "niebla": "#E5F2F3", "hielo": "#FDFDE2", "celeste": "#E5F2F3", "madera": "#30615B", "piso": "#E5F2F3", "gris": "#D6E4E2", "amarillo": "#8CD147"}, "anclas": {"fundamento-documento.webp": {"r": 1.1613, "p": [[50, 15], [52, 37], [19, 41], [72, 34]]}, "clasificacion-carpetas.webp": {"r": 1.5177, "p": [[30, 80], [45, 80], [60, 82], [41, 47], [85, 58]]}, "captura-detenido.webp": {"r": 1.2894, "p": [[37, 28], [80, 32], [50, 84], [52, 57]]}, "terminos-reloj.webp": {"r": 1.833, "p": [[45, 60], [55, 12], [37, 23]]}, "investigacion-lupa.webp": {"r": 1.4019, "p": [[40, 12], [88, 14], [78, 32], [55, 72], [14, 82]]}, "sustentacion-audiencia.webp": {"r": 1.4241, "p": [[31, 46], [40, 32], [55, 65], [80, 45], [70, 24]]}, "entrega-carpeta.webp": {"r": 1.8293, "p": [[60, 22], [78, 30]]}, "revisan-documento.webp": {"r": 1.0896, "p": [[64, 30], [52, 34]]}, "dialogo-carpeta.webp": {"r": 1.1719, "p": [[78, 35], [50, 30]]}, "lee-libro-explica.webp": {"r": 1.1321, "p": [[30, 27], [46, 17], [73, 30]]}, "explica-brazos.webp": {"r": 1.3373, "p": [[78, 30], [54, 22], [12, 32]]}, "alto-documento.webp": {"r": 1.2987, "p": [[63, 25], [50, 17]]}, "trio-dialogo.webp": {"r": 1.4706, "p": [[82, 30], [38, 22], [55, 30]]}, "corren-carpetas.webp": {"r": 1.6854, "p": [[30, 25], [73, 27]]}}, "respiro": 370, "pagina": 481, "paginaLamina": 740, "claveVentana": 300, "tablaVentana": true, "juego": {"clave": "l1826-juego-u4-l3", "niveles": ["Observador", "Analista", "Fiscal del abreviado", "Referente en el procedimiento abreviado"]}, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "l1826", "partirComas": true, "bitacora": true, "rellenoHoja": true, "filaOpciones": 1, "retro": {"reacciones": ["p-alto-documento.webp", "p-explica-brazos.webp", "p-dialogo-carpeta.webp"], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": ["ley-d-choque.webp"], "rotulo": "Unidad 4 · Lección 3"}, "leccion_rotulo": "Lección 3", "unit": 4, "lesson": 3, "heading": "Lección 3: Conciliación en delitos querellables y la guía institucional", "scenes": [{"layout": "fichas", "segmentos": ["Objetivo de la lección: Comprender, tramitar y gestionar la conciliación preprocesal como requisito obligatorio de procedibilidad en los delitos querellables (grupo I, art. 74 del CPP) dentro del procedimiento penal especial abreviado (Ley 1826 de 2017 y Art. 522 del CPP), con aplicación del procedimiento unificado fijado en la guía institucional FGN-MP02-G-04, la citación formal mediante el formato FGN-MP02-F-10 y las consecuencias jurídicas del acuerdo o la inasistencia de las partes, salvaguardando el debido proceso y evitando la indebida paralización de investigaciones oficiosas.", "De conformidad con lo dispuesto en el artículo 522 de la Ley 906 de 2004 y en concordancia con la estructura del procedimiento penal especial abreviado, la conciliación prejudicial se constituye en un presupuesto obligatorio de procedibilidad de la acción penal para las conductas punibles clasificadas como querellables (grupo I del catálogo). Esta categoría de delitos, enlistada en el artículo 74 del CPP (como lesiones personales culposas, injuria, calumnia, abuso de confianza ordinario y daño en bien ajeno), requiere que la FGN, a través del fiscal delegado correspondiente, verifique y agote formalmente el intento de acercamiento amistoso entre víctima y persona indiciada antes de proferir y realizar el traslado directo del escrito de acusación."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Objetivo de la lección", "segs": [0], "obj": "libros"}, {"label": "Introducción", "segs": [1], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 3: Conciliación en delitos querellables y la guía institucional", "grupo": null, "titulos_fuente": ["Lección 3: Conciliación en delitos querellables y la guía institucional", "Introducción"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Objetivo de la lección", "Introducción"], "titulo_genially": "Conciliación en delitos querellables y la guía institucional", "complemento_genially": "", "apartado": "", "bloques_fuente": [44, 46], "ilustracion": "lee-libro-explica.webp"}, {"layout": "lamina", "segmentos": ["Alerta: El agotamiento de la conciliación preprocesal como requisito de procedibilidad solo recae sobre los delitos querellables. En ninguna circunstancia los fiscales o asistentes de fiscales deben exigir la conciliación previa, ni suspender el proceso a la espera de la misma, para los delitos investigables de oficio que rigen el procedimiento abreviado conforme al artículo 534 numeral 2 del CPP (como VIF o inasistencia alimentaria). Supeditar el traslado de la acusación de un delito de oficio a una conciliación inexistente constituye un error procedimental grave que retarda de forma injustificada la administración de justicia.", "La omisión de este requisito legal, cuando es procedente, genera un vicio estructural insubsanable. Si la Fiscalía realiza el traslado del escrito de acusación (lo que equivale materialmente a la imputación) con la omisión de citar a conciliación, se infringe directamente el debido proceso legal (formas propias de cada juicio, artículo 29 de la Constitución). El juez o jueza de conocimiento competente, al advertir esta irregularidad en la fase de saneamiento de la audiencia concentrada, deberá por fuerza declarar de oficio o a solicitud de parte la nulidad de todo lo actuado, desde el traslado del escrito de acusación inclusive, con la correspondiente pérdida de tiempo judicial y el riesgo inminente de caducidad de la querella."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Alerta", "segs": [0], "obj": "escudo", "alerta": true}, {"label": "La omisión de este requisito legal", "segs": [1], "obj": "documento"}]}], "rotulo": null, "seccion": "Introducción", "grupo": null, "titulos_fuente": ["Introducción"], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Alerta", "La omisión de este requisito legal"], "titulo_genially": "Conciliación preprocesal como requisito de procedibilidad", "complemento_genially": "", "apartado": "Introducción", "bloques_fuente": [47, 48], "ilustracion": "alto-documento.webp"}, {"layout": "esquema", "segmentos": ["La FGN, en aras de estandarizar la actuación de sus fiscales a nivel nacional y garantizar la transparencia y eficiencia judicial, expidió el procedimiento unificado y la Guía para la intervención y conciliación identificada bajo el código institucional FGN-MP02-G-04. Este instrumento administrativo rige de forma obligatoria las actuaciones preprocesales y fija pautas estrictas sobre la oportunidad del trámite, los efectos ante inasistencias y las consecuencias sustanciales de la suscripción de acuerdos.", "El trámite de conciliación preprocesal puede surtirse ante el fiscal de conocimiento asignado al caso, ante conciliadores en equidad o en los centros de conciliación legalmente autorizados (públicos o privados). Su oportunidad temporal se extiende desde el conocimiento de la noticia criminal (sea por denuncia o querella formulada en término de caducidad) hasta antes de que se corra traslado formal del escrito de acusación. No obstante, las partes también podrán conciliar con posterioridad y en cualquier momento del proceso penal abreviado antes de que se profiera sentencia de primera instancia, de conformidad con el artículo 547 CPP y la guía institucional FGN-MP02-G-04.", "La inasistencia a la citación formal efectuada a través del Formato FGN-MP02-F-10 genera consecuencias procesales disímiles y obligatorias de control para quien ejerce como fiscal. Por ejemplo, si la víctima querellante no asiste a la diligencia de forma injustificada dentro de los tres días hábiles siguientes, el o la fiscal del caso debe interpretar esta conducta como el desinterés definitivo de la pretensión punitiva y proceder de inmediato al archivo de las diligencias, según lo prescribe la Guía FGN-MP02-G-04 (art. 522 C.P.P.)", "Hay una excepción absoluta si la víctima es un menor de edad o persona incapaz; en este caso la investigación no se archivará y deberá continuarse de oficio. En cambio, si el indiciado está debidamente citado mediante formato FGN-MP02-F-10 no asiste sin justificación válida acreditada en el término legal, el o la fiscal debe dar por cumplido y por ineficaz el requisito de procedibilidad (art. 522 C.P.P.). En este evento, se levantará el acta de inasistencia, quedando la Fiscalía habilitada formalmente para continuar con el rito procesal y ordenar de inmediato el traslado del escrito de acusación.", "La culminación de la etapa preprocesal de conciliación genera dos rutas jurídicas definitivas:", "a) Cuando se concreta un acuerdo conciliatorio (resultado favorable): se redacta un acta de conciliación en las que se consignan las obligaciones asumidas por las partes para resolver el conflicto y reparar los daños ocasionados, cuando corresponda. Como buena práctica, estas obligaciones deben formularse de manera clara, expresa y exigible, de modo que permitan identificar con precisión quién debe cumplir, qué debe cumplir, a favor de quién, en qué plazo y en qué condiciones. Por ejemplo, no basta con señalar que una de las partes ‘’se compromete a reparar los daños ocasionados¨. Es preferible establecer que ¨Juan Pérez pagará a María López la suma de $500.000, en un único desembolso, a más tardar el 15 de noviembre de 2026, mediante transferencia a la cuenta acordada por las partes¨. De igual forma, si se acuerda la devolución de un bien, debe identificarse el objeto y fijarse la fecha y el lugar de entrega. Si se pacta una disculpa, conviene precisar la forma, el destinatario y el plazo para ofrecerla, respetando la voluntariedad y la dignidad de las personas involucradas. La precisión de la formulación de las obligaciones facilita la verificación de su cumplimiento y, cuando se satisfacen los requisitos legales aplicables, permite que el acta preste mérito ejecutivo en caso de incumplimiento. Por ello, deben evitarse expresiones ambiguas o compromisos indeterminados, como ¨pagar cuando sea posible¨, ¨reparar posteriormente¨ o ¨no volver a tener problemas¨, si no se acompañan de condiciones concretas que permitan establecer su cumplimiento. De conformidad con el artículo 522 del C.P.P. el acuerdo conciliatorio produce efectos de cosa juzgada y el acta presta mérito ejecutivo en los términos legales. El efecto procesal correspondiente sobre la acción penal debe adoptarse conforme a las disposiciones aplicables y al estado de las diligencias. Cuando el acuerdo contemple obligaciones sujetas a un plazo o a un cumplimiento posterior, es necesario distinguir entre la celebración del acuerdo y su cumplimiento efectivo, sin asumir que el simple vencimiento del plazo o la existencia de un compromiso pendiente determina, por sí solo, la consecuencia procesal que debe adoptar la Fiscalía.", "b) Cuando no hay acuerdo (resultado desfavorable): si las partes comparecen, pero no llegan a un consenso reparatorio, se suscribe el acta de no acuerdo. Este documento perfecciona la condición de procedibilidad, por lo que el o la fiscal continuará, con el impulso del procedimiento especial abreviado, mediante el correspondiente traslado de acusación."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [], "lead": [0], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Oportunidad procesal del trámite de conciliación", "segs": [1], "obj": "reloj"}, {"label": "Régimen de inasistencia a la citación de conciliación (formato FGN-MP02-F-10)", "segs": [2, 3], "obj": "expediente"}, {"label": "Efectos del acuerdo o del no acuerdo en la actuación penal", "segs": [4, 5, 6], "obj": "personas"}]}], "rotulo": "Oportunidad, inasistencia y efectos según la guía FGN-MP02-G-04", "seccion": "1. Oportunidad, inasistencia y efectos según la guía FGN-MP02-G-04", "grupo": null, "titulos_fuente": ["1. Oportunidad, inasistencia y efectos según la guía FGN-MP02-G-04", "1.1. Oportunidad procesal del trámite de conciliación", "1.2. Régimen de inasistencia a la citación de conciliación (formato FGN-MP02-F-10)", "1.3. Efectos del acuerdo o del no acuerdo en la actuación penal"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Oportunidad procesal del trámite de conciliación", "Régimen de inasistencia a la citación de conciliación (formato FGN-MP02-F-10)", "Efectos del acuerdo o del no acuerdo en la actuación penal"], "titulo_genially": "Oportunidad, inasistencia y efectos según la guía FGN-MP02-G-04", "complemento_genially": "", "apartado": "1. Oportunidad, inasistencia y efectos según la guía FGN-MP02-G-04", "bloques_fuente": [49, 59], "objeto_raiz": "libros", "objetos_raiz": ["libros", "escudo", "escalones"], "escenario": {"bioma": "sala", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "paginaAncha": 1300, "descargaMapa": {"archivo": "descargas/mapa-conceptual-conciliacion-guia-fgn.png", "nombre": "Mapa conceptual - Oportunidad, inasistencia y efectos de la conciliación (Ley 1826 de 2017, U4 L3).png", "boton": "Clic para descargar el mapa"}}]}</script>
