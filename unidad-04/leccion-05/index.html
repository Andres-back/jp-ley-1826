 360, "pagina": 440, "juego": {"clave": "l1826-juego-u4-l5", "niveles": ["Observador", "Analista", "Fiscal del abreviado", "Referente en el procedimiento abreviado"]}, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "l1826", "partirComas": true, "bitacora": true, "rellenoHoja": true, "filaOpciones": 1, "retro": {"reacciones": ["p-alto-documento.webp", "p-explica-brazos.webp", "p-dialogo-carpeta.webp"], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": ["ley-d-choque.webp"], "rotulo": "Unidad 4 · Lección 5"}, "leccion_rotulo": "Lección 5", "unit": 4, "lesson": 5, "heading": "Lección 5: Enfoque de género en justicia restaurativa y articulación con el principio de oportunidad", "scenes": [{"layout": "fichas", "segmentos": ["Objetivo de la Lección: Comprender, integrar y aplicar la perspectiva de género y los estándares de debida diligencia en los mecanismos de justicia restaurativa y soluciones alternativas del procedimiento penal especial abreviado (Ley 1826 de 2017), con aplicación imperativa de la prohibición categórica de autocomposición en VIF y basada en género (Directiva 0001 de 2021 de la FGN y Sentencia SU-360 de 2024) con el fin de evitar la impunidad, prevenir feminicidios y salvaguardar los derechos de las víctimas.", "En la práctica judicial y conforme a las exigencias convencionales (CEDAW, Convención de Belém do Pará), la FGN debe ejercer un control riguroso y exhaustivo respecto de la idoneidad y viabilidad material de cualquier trámite conciliatorio o restaurativo cuando se adviertan dinámicas de conflicto originadas en contextos de pareja o expareja sentimental. La asimetría histórica de poder y la presencia de ciclos de dominación psicológica, económica o física exigen que operadores judiciales descarten de forma categórica la existencia de factores de sumisión o coacción implícita antes de convalidar un acuerdo.", "Para ello, fiscales delegados(as) y asistentes judiciales deben verificar de manera previa e indispensable el cumplimiento de condiciones de seguridad y libertad, la ausencia de asimetría extrema y entornos de coacción en la pareja mediante entrevistas personales individuales y separadas con la víctima, la asistencia con total libertad de la víctima al proceso de solución alternativa, así como descartar que su participación esté motivada por presiones económicas, amenazas de retaliación física contra ella o sus hijos, o chantajes emocionales encaminados al perdón incondicional.", "Si la noticia criminal revela una conducta de VIF sistemática o un ciclo arraigado de agresión basada en género, se descarta materialmente la mediación y la conciliación. En estos escenarios, el acuerdo restaurativo constituye una herramienta de revictimización y desprotección estatal para estructurar una verdadera prohibición en contextos de violencia.", "La víctima y la persona indiciada deben contar con asesoramiento independiente de profesionales calificados interdisciplinares (como psicología forense, trabajo social o defensa técnica) para asegurar que el acuerdo no perpetúe la impunidad de la persona señalada como agresora ni la normalización de la agresión familiar.", "En caso de viabilidad material de conciliación en conductas menores que no correspondan a violencia sistemática, las sesiones deben programarse bajo estrictas condiciones físicas que garanticen la seguridad y el distanciamiento espacial, evitando la confrontación directa o la humillación de la víctima."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Objetivo de la lección", "segs": [0], "obj": "libros"}, {"label": "Introducción", "segs": [1, 2], "obj": "personas"}, {"label": "Conducta de VIF sistemática", "segs": [3], "obj": "escudo"}, {"label": "Asesoramiento independiente", "segs": [4], "obj": "expediente"}, {"label": "Viabilidad material de conciliación en conductas menores", "segs": [5], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 5: Enfoque de género en justicia restaurativa y articulación con el principio de oportunidad", "grupo": null, "titulos_fuente": ["Lección 5: Enfoque de género en justicia restaurativa y articulación con el principio de oportunidad", "Introducción"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Objetivo de la lección", "Introducción", "Conducta de VIF sistemática", "Asesoramiento independiente", "Viabilidad material de conciliación en conductas menores"], "titulo_genially": "Enfoque de género en justicia restaurativa y articulación con el principio de oportunidad", "complemento_genially": "", "apartado": "", "bloques_fuente": [78, 84], "ilustracion": "trio-dialogo.webp"}, {"layout": "esquema", "segmentos": ["El delito de VIF (art. 229 del CP), a pesar de estar incluido formalmente en el catálogo de aplicabilidad del procedimiento penal especial abreviado (art. 534, numeral 2, del CPP y Ley 1826 de 2017), cuenta con un régimen operativo y sustancial restrictivo de máxima severidad, que está orientado por el bloque de constitucionalidad, los tratados internacionales ratificados por Colombia (por ejemplo, la Convención de Belém do Pará y la CEDAW), y de forma directa por la Directiva 0001 de 2021 proferida por el Fiscal General de la Nación.", "De conformidad con las directrices vinculantes e institucionales de la Directiva 0001 de 2021 de la FGN, se prohíbe de forma taxativa, categórica e insalvable a todos(as) los(las) fiscales de la República sugerir, convocar, tramitar o convalidar cualquier acuerdo conciliatorio en los procesos que se adelanten por el delito de VIF y VBG. Esta limitación responde al mandato constitucional y convencional de prevenir, sancionar y erradicar la violencia contra la mujer, impidiendo que la acción penal del Estado sea neutralizada mediante arreglos privados que banalicen la agresión, perpetúen la impunidad o pongan en situación de desprotección extrema a la víctima agredida sexual o físicamente, en concordancia con lo dispuesto en la Sentencia SU-360 de 2024 de la Corte Constitucional.", "Ante la ocurrencia de un hecho fáctico de VIF o agresión de género, quien sea fiscal de la causa y su equipo tienen la obligación jurídica imperativa de aplicar las pautas de debida diligencia delineadas en la Directiva 0001 de 2021. Esto debe hacerse con acciones obligatorias en tres frentes, como la orden oficiosa y urgente de las medidas de protección y de seguridad consagradas en la ley: el desalojo del agresor del domicilio común; la prohibición de acercamiento a la víctima en sus entornos laborales, académicos o de residencia; y el debido acompañamiento de protección en coordinación directa con la Policía Nacional, previniendo agresiones ulteriores (conforme a la ley 1257 de 2008).", "Asimismo, queda prohibido obligar a la víctima a enfrentarse directa o administrativamente con su agresor o inducirla a rendir su testimonio en condiciones que la expongan a humillación o intimidación. Los y las fiscales deben propiciar entornos de toma de declaración controlados, privados y, preferiblemente, mediante la práctica excepcional de la prueba anticipada (art. 284 del CPP) para evitar el desgaste o la retractación psíquica en el transcurso del juicio oral.", "Finalmente, de acuerdo con la Sentencia SU-360 de 2024 de la Corte Constitucional, los y las operadores(as) judiciales deben valorar el acervo probatorio con una perspectiva diferencial de género, descartando prejuicios androcéntricos que resten credibilidad al relato de la persona agredida por la ausencia de lesiones visibles o por retractaciones posteriores que respondan al síndrome de indefensión aprendida."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "El delito de VIF (art. 229 del CP)", "segs": [0], "obj": "libros"}, {"label": "La prohibición absoluta de mecanismos de autocomposición", "segs": [1], "obj": "escudo"}, {"label": "Medidas de protección oficiosas y deber de no revictimización", "segs": [2, 3, 4], "obj": "casa"}]}], "rotulo": null, "seccion": "1. VIF, enfoque de género y Directiva 0001 de 2021 de la FGN", "grupo": null, "titulos_fuente": ["1. VIF, enfoque de género y Directiva 0001 de 2021 de la FGN", "1.1. La prohibición absoluta de mecanismos de autocomposición", "1.2. Medidas de protección oficiosas y deber de no revictimización"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["El delito de VIF (art. 229 del CP)", "La prohibición absoluta de mecanismos de autocomposición", "Medidas de protección oficiosas y deber de no revictimización"], "titulo_genially": "VIF, enfoque de género y Directiva 0001 de 2021 de la FGN", "complemento_genially": "", "apartado": "1. VIF, enfoque de género y Directiva 0001 de 2021 de la FGN", "bloques_fuente": [85, 92], "objeto_raiz": "libros", "objetos_raiz": ["libros", "escalones", "documento"], "escenario": {"bioma": "barrio", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido."}, {"layout": "mental", "segmentos": ["La mediación penal y los acuerdos reparatorios alcanzados en las soluciones alternativas de conflictos no operan de forma aislada, sino que se articulan sistemáticamente con el principio de oportunidad (arts. 321 a 330 del CPP). En el marco del procedimiento especial abreviado de la Ley 1826 de 2017, esta articulación sirve de puente normativo y de conexión procedimental con otros ritos de persecución penal, en especial cuando se presentan supuestos de concurso de delitos mixtos (ordinarios y abreviados) que imponen la cuerda procesal del procedimiento penal ordinario.", "Bajo este esquema de conexión procedimental, si una persona indiciada es procesada bajo el procedimiento ordinario (Ley 906) debido a un concurso mixto que involucra un delito de oficio del catálogo abreviado (por ejemplo, hurto calificado en concurso con porte ilegal de armas de fuego), quien sea fiscal de conocimiento puede recurrir de forma legítima a la aplicación del principio de oportunidad como vía de descongestión diferencial. En estos casos, el cumplimiento exitoso de un acuerdo reparatorio de mediación penal (conforme a los formatos institucionales FGN-MP02-F-131, F-132 y F-133) respecto del delito de menor lesividad (el hurto) servirá como el fundamento fáctico objetivo para solicitar ante juez de control de garantías la suspensión del procedimiento a prueba o la renuncia total del ejercicio de la acción penal de dicho cargo y centrarse en la persecución del Estado únicamente en la conducta principal no conciliable."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "mental", "items": [{"label": "La mediación penal y los acuerdos reparatorios", "segs": [0], "obj": "personas"}, {"label": "Esquema de conexión procedimental", "segs": [1], "obj": "expediente"}]}], "rotulo": null, "seccion": "2. Articulación con el principio de oportunidad", "grupo": null, "titulos_fuente": ["2. Articulación con el principio de oportunidad"], "encabezados": [], "mediacion": "Mapa mental: la idea central y sus ramas; cada rama abre su texto completo.", "rotulos": ["La mediación penal y los acuerdos reparatorios", "Esquema de conexión procedimental"], "titulo_genially": "Articulación con el principio de oportunidad", "complemento_genially": "", "apartado": "2. Articulación con el principio de oportunidad", "bloques_fuente": [93, 95], "arte": {"img": "trio-dialogo.webp", "pos": "centro"}, "descarga": {"href": "documentos/mapa-u4-l5-p03.png", "rotulo": "Clic para descargar el mapa", "nombre": "Mapa conceptual: Articulación con el principio de oportunidad (imagen PNG)", "lamina": true}}, {"layout": "pestanas", "pestanas": [{"layout": "actividad", "segmentos": ["(Verdadero o falso)", "Pregunta de control 1", "En un proceso por el delito de inasistencia alimentaria (art. 233 del CP) el Fiscal cita a las partes a una diligencia de conciliación preprocesal, dicha actuación vicia de nulidad insubsanable el proceso por vulneración al debido proceso, toda vez que la Ley 1542 de 2012 le quitó el carácter de querellable a esta conducta.", "Falso", "Justificación: Aunque la Ley 1542 de 2012 eliminó la conciliación como requisito de procedibilidad obligatorio, el intento de diálogo restaurativo o arreglo compositivo sigue siendo una facultad legalmente válida. Al no generar un perjuicio o agravio sustancial a las garantías de la defensa, no se cumple el principio de trascendencia (art. 457 del CPP), por lo que la solicitud de nulidad es infundada."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "actividad", "modo": "preguntas", "intro": [], "preguntas": [{"contexto": [], "cab": 1, "linea_opciones": false, "caption": 0, "enunciado": [2], "respuesta": 3, "retro": [4], "fuente": [], "opciones": [{"texto": "Verdadero", "letra": "A", "ok": false}, {"texto": "Falso", "letra": "B", "ok": true}]}], "items": [{"label": "Pregunta de control 1", "segs": [0, 1, 2, 3, 4], "obj": "documento"}], "cierre": []}], "rotulo": null, "seccion": "Preguntas de control", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Actividad con retroalimentación: se elige una opción; si no es la correcta, se lee la retroalimentación y se vuelve a intentar; la correcta deja pasar a la siguiente.", "rotulos": ["Pregunta de control 1"], "titulo_genially": "Actividad práctica: enfoque de género en justicia restaurativa y articulación con el principio de oportunidad (1 de 3)", "complemento_genially": "", "apartado": "Preguntas de control", "relleno": "sustentacion-audiencia.webp", "guia": "Elija «Verdadero» o «Falso».", "bloques_fuente": [142, 146], "pestana": "Pregunta de control 1"}, {"layout": "actividad", "segmentos": ["Pregunta de control 2", "En un proceso por lesiones personales culposas en accidente de tránsito, el registro de audio de la sesión de mediación penal fallida puede ser introducido como prueba por la Fiscalía en el juicio oral para demostrar que el acusado admitió haber conducido con exceso de velocidad.", "Falso", "Justificación: Conforme al artículo 525 del CPP y la garantía contra la autoincriminación (art. 33 CP), los trámites de mediación gozan de confidencialidad absoluta. Cualquier manifestación, aceptación de hechos u oferta de reparación realizada en la mediación no puede ser utilizada como prueba en el juicio y el juez debe aplicar la regla de exclusión probatoria."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "actividad", "modo": "preguntas", "intro": [], "preguntas": [{"contexto": [], "cab": 0, "linea_opciones": false, "caption": null, "enunciado": [1], "respuesta": 2, "retro": [3], "fuente": [], "opciones": [{"texto": "Verdadero", "letra": "A", "ok": false}, {"texto": "Falso", "letra": "B", "ok": true}]}], "items": [{"label": "Pregunta de control 2", "segs": [0, 1, 2, 3], "obj": "documento"}], "cierre": []}], "rotulo": null, "seccion": "Preguntas de control", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Actividad con retroalimentación: se elige una opción; si no es la correcta, se lee la retroalimentación y se vuelve a intentar; la correcta deja pasar a la siguiente.", "rotulos": ["Pregunta de control 2"], "titulo_genially": "Actividad práctica: enfoque de género en justicia restaurativa y articulación con el principio de oportunidad (2 de 3)", "complemento_genially": "", "apartado": "Preguntas de control", "relleno": "p-dialogo-carpeta-2.webp", "guia": "Elija «Verdadero» o «Falso».", "bloques_fuente": [147, 150], "pestana": "Pregunta de control 2"}, {"layout": "actividad", "segmentos": ["Pregunta de control 3", "En atención a la autonomía de la voluntad de la víctima, el fiscal delegado debe conceder la remisión a mediación y archivar la investigación por VIF si la víctima manifiesta voluntariamente que desea desistir porque su cónyuge le pidió disculpas y ella depende económicamente de él.", "Falso", "Justificación: La VIF es un delito de persecución oficiosa e indesistible (Ley 1542 de 2012). Además, la Directiva 0001 de 2021 de la FGN y la doctrina constitucional prohíben taxativamente someter estos casos a mediación o avalar desistimientos motivados por el ciclo de violencia o la dependencia económica. Siendo así, se impone al Fiscal el deber de impulsar la persecución penal y activar medidas de protección de urgencia."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "actividad", "modo": "preguntas", "intro": [], "preguntas": [{"contexto": [], "cab": 0, "linea_opciones": false, "caption": null, "enunciado": [1], "respuesta": 2, "retro": [3], "fuente": [], "opciones": [{"texto": "Verdadero", "letra": "A", "ok": false}, {"texto": "Falso", "letra": "B", "ok": true}]}], "items": [{"label": "Pregunta de control 3", "segs": [0, 1, 2, 3], "obj": "documento"}], "cierre": []}], "rotulo": null, "seccion": "Preguntas de control", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Actividad con retroalimentación: se elige una opción; si no es la correcta, se lee la retroalimentación y se vuelve a intentar; la correcta deja pasar a la siguiente.", "rotulos": ["Pregunta de control 3"], "titulo_genially": "Actividad práctica: enfoque de género en justicia restaurativa y articulación con el principio de oportunidad (3 de 3)", "complemento_genially": "", "apartado": "Preguntas de control", "relleno": "p-dialogo-carpeta-2.webp", "guia": "Elija «Verdadero» o «Falso».", "bloques_fuente": [151, 154], "pestana": "Pregunta de control 3"}], "segmentos": [], "parrafo": [], "vineta": [], "lead": [], "titul
