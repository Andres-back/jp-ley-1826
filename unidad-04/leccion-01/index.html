, "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": ["ley-d-choque.webp"], "rotulo": "Unidad 4 · Lección 1"}, "leccion_rotulo": "Lección 1", "unit": 4, "lesson": 1, "heading": "Lección 1: Aceptación de cargos y justicia premial en el procedimiento abreviado", "scenes": [{"layout": "fichas", "segmentos": ["Objetivo de la lección: Analizar, estructurar y aplicar el régimen de aceptación unilateral de cargos y justicia premial en el procedimiento penal especial abreviado (Ley 1826 de 2017), mediante el reconocimiento de los tres momentos procesales de allanamiento (art. 539 del CPP) con sus correspondientes escalas de rebaja punitiva (hasta la mitad, una tercera parte y una sexta parte) y la aplicación de la unificación jurisprudencial de la Corte Suprema de Justicia (Sentencias CSJ SP3383-2019 y SP1763-2018) sobre la concesión plena de estos beneficios en situaciones de captura en flagrancia.", "La Ley 1826 de 2017 busca incentivar la justicia premial y la terminación anticipada del proceso mediante un esquema de rebajas punitivas escalonadas y altamente favorables, aplicables incluso en hipótesis de captura en flagrancia."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Objetivo de la lección", "segs": [0], "obj": "libros"}, {"label": "Introducción", "segs": [1], "obj": "documento"}]}], "rotulo": null, "seccion": "Lección 1: Aceptación de cargos y justicia premial en el procedimiento abreviado", "grupo": null, "titulos_fuente": ["Lección 1: Aceptación de cargos y justicia premial en el procedimiento abreviado", "Introducción"], "encabezados": [], "mediacion": "Fichas: cada pestaña muestra su texto en el panel.", "rotulos": ["Objetivo de la lección", "Introducción"], "titulo_genially": "Aceptación de cargos y justicia premial en el procedimiento abreviado", "complemento_genially": "", "apartado": "", "bloques_fuente": [21, 23], "ilustracion": "captura-detenido.webp"}, {"layout": "esquema", "segmentos": ["El beneficio de reducción de pena se gradúa estrictamente de acuerdo con el momento procesal en que la persona procesada decida aceptar su responsabilidad penal, configurándose tres hitos clave:", "Momento 1: previo a la audiencia concentrada: la persona indiciada, asistida por su defensa, manifiesta a el o la fiscal de conocimiento su intención de aceptar los cargos formulados. Se suscribe un acta conjunta que se remite inmediatamente al juez o jueza de conocimiento. El beneficio punitivo en este momento es de hasta la mitad de la pena a imponer.", "Momento 2: al inicio de la audiencia concentrada: instalada la audiencia concentrada, el juez o jueza de conocimiento interroga al procesado sobre su allanamiento unilateral. La rebaja de pena es de hasta una tercera parte de la sanción imponible.", "Momento 3: al inicio de la audiencia de juicio oral: una vez instalado el debate oral, antes de la práctica probatoria, el juez o jueza vuelve a interrogar a la persona procesada sobre los cargos formulados en su contra. La reducción en esta última oportunidad procesal equivale a una sexta parte de la pena.", "Uno de los debates más intensos resueltos por la jurisprudencia constitucional y ordinaria gira en torno a la aplicación de la rebaja punitiva por allanamiento en flagrancia. En el procedimiento ordinario (Ley 906, artículo 301), la rebaja para capturados en flagrancia se encuentra severamente limitada a una cuarta parte del beneficio general (quedando reducida al 12,5%).", "No obstante, el parágrafo del artículo 539 de la Ley 1826 de 2017 establece expresamente que las rebajas punitivas allí consagradas se aplicarán plenamente en los casos de flagrancia. La Sala de Casación Penal de la Corte Suprema de Justicia, en providencias de unificación como la Sentencia CSJ SP3383-2019 (Radicado 51776) y la Sentencia SP1763-2018 (Radicado 51989), determinó que el régimen premial del artículo 539 de la Ley 1826 es sustancialmente más favorable, razón por la cual debe aplicarse retroactivamente en virtud del principio de favorabilidad constitucional para de personas capturadas en flagrancia por delitos que pertenezcan al catálogo del artículo 534 del CPP, aun cuando el proceso se hubiere adelantado bajo la cuerda ordinaria.", "Alerta: La Corte Suprema de Justicia ha precisado de forma unánime que el principio de favorabilidad derivado del régimen premial de la Ley 1826 exige identidad de supuestos de hecho. Es decir, solo es posible predicar la favorabilidad penal de la rebaja del 50% en flagrancia para aquellos procesados cuya conducta punible se encuentre explícitamente listada en el catálogo de aplicabilidad del procedimiento especial abreviado (art. 534 del CPP).", "Si la persona fue capturada en flagrancia por un delito de procedimiento ordinario (por ejemplo, tráfico de estupefacientes o extorsión), no es jurídicamente viable aplicar de forma analógica la rebaja del artículo 539 por prohibición expresa de la norma."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7], "vineta": [], "lead": [0], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Momento 1: previo a la audiencia concentrada", "segs": [1], "obj": "documento"}, {"label": "Momento 2: al inicio de la audiencia concentrada", "segs": [2], "obj": "personas"}, {"label": "Momento 3: al inicio de la audiencia de juicio oral", "segs": [3], "obj": "tribunal"}, {"label": "Unificación jurisprudencial sobre la flagrancia y favorabilidad", "segs": [4, 5], "obj": "libros"}, {"label": "Alerta", "segs": [6, 7], "obj": "escudo"}]}], "rotulo": "Los tres momentos de allanamiento unilateral (art. 539 del CPP)", "seccion": "1. Los tres momentos de allanamiento unilateral (art. 539 del CPP)", "grupo": null, "titulos_fuente": ["1. Los tres momentos de allanamiento unilateral (art. 539 del CPP)", "2. Unificación jurisprudencial sobre la flagrancia y favorabilidad"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la es
