dición de la Ley 1826 de 2017, identificando la finalidad de descongestión judicial, simplificación procesal y respuesta oportuna a las víctimas, para garantizar la imparcialidad judicial y el debido proceso."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Objetivo de la lección", "segs": [0], "obj": "libros", "acomp": ["escudo", "documento"]}]}], "rotulo": null, "seccion": "Lección 1. Finalidad y razones de política criminal de la Ley 1826 de 2017", "grupo": null, "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Objetivo de la lección"], "titulo_genially": "Finalidad y razones de política criminal de la Ley 1826 de 2017", "ilustracion": "p-dialogo-carpeta.webp", "relleno": "fundamento-documento.webp", "arte": {"img": "p-dialogo-carpeta.webp", "pos": "izq"}, "pestana": "Objetivo de la lección"}, {"layout": "esquema", "segmentos": ["El procedimiento penal especial abreviado fue introducido en Colombia mediante la Ley 1826 de 2017 y constituye una reforma estructural del sistema penal colombiano al determinar un procedimiento que se puede entender como paralelo al de la Ley 906 de 2004 e incorporar una herramienta procedimental dirigida a las víctimas: el acusador privado. Esta figura tiene el propósito de enfrentar los altos índices de congestión judicial e impunidad que caracterizan al sistema acusatorio tradicional, sobre todo frente a conductas punibles de menor lesividad, pero de alta ocurrencia y sensibilidad social.", "La finalidad primordial de este procedimiento especial es simplificar y acelerar el trámite procesal mediante la reducción de las etapas y audiencias judiciales que pueden resultar innecesarias para los delitos en los cuales procede. Su objetivo es garantizar una pronta y efectiva administración de justicia, con respuesta ágil a las víctimas. Con ella se transita de un modelo de justicia basado en las audiencias hacia uno en el que la fase inicial de vinculación e investigación se desarrolla en su mayor parte por escrito y de forma directa.", "Este nuevo modelo reserva la intervención judicial para el debate probatorio y la resolución de la situación jurídica sustancial."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Una reforma estructural", "segs": [0], "obj": "libros"}, {"label": "La finalidad primordial", "segs": [1, 2], "obj": "escudo"}]}], "rotulo": null, "seccion": "Introducción", "grupo": null, "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Una reforma estructural", "La finalidad primordial"], "titulo_genially": "Introducción", "ilustracion": "fundamento-documento.webp", "relleno": "sustentacion-audiencia.webp", "arte": {"img": "fundamento-documento.webp", "pos": "fondo"}, "escenario": {"bioma": "centro", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido.", "pestana": "Introducción"}], "segmentos": [], "parrafo": [], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [], "rotulo": null, "seccion": "Lección 1. Finalidad y razones de política criminal de la Ley 1826 de 2017", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Pestañas: lamina, esquema", "rotulos": ["Objetivo de la lección", "Introducción"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "", "guia": "Recorra cada pestaña en orden: cada una es una parte de esta diapositiva."}, {"layout": "puntos", "segmentos": ["La Ley 1826 de 2017 entró en vigencia el 13 de julio de 2017. El ámbito temporal de aplicación se rige por las siguientes reglas operativas:", "a) Conductas cometidas con posterioridad al 13 de julio de 2017: se tramitan de forma obligatoria y exclusiva por el trámite abreviado, siempre que la conducta esté incluida en el catálogo de procedencia.", "b) Conductas cometidas con anterioridad al 13 de julio de 2017: se tramitan bajo el procedimiento abreviado únicamente si a la fecha de entrada en vigencia de la ley no se había formulado imputación de cargos conforme al procedimiento ordinario de la Ley 906 de 2004. Si ya existía imputación, el proceso debe culminar bajo la cuerda del procedimiento ordinario."], "parrafo": [0, 1, 2], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "puntos", "items": [{"label": "Entró en vigencia", "segs": [0, 1], "obj": "libros"}, {"label": "Conductas cometidas con anterioridad al 13", "segs": [2], "obj": "reloj"}]}], "rotulo": null, "seccion": "1. Vigencia y ámbito temporal de aplicación", "grupo": null, "encabezados": [], "mediacion": "Ilustración con puntos sobre los objetos: cada punto abre su texto completo.", "rotulos": ["Entró en vigencia", "Conductas cometidas con anterioridad al 13"], "titulo_genially": "Vigencia y ámbito temporal de aplicación", "ilustracion": "fundamento-documento.webp", "relleno": "fundamento-documento.webp"}, {"seccion": "2. Razones político-criminales", "grupo": null, "titulos_fuente": null, "apartado": null, "complemento_genially": null, "relleno": "terminos-reloj.webp", "layout": "rejilla", "segmentos": ["La búsqueda de un trámite procesal expedito para combatir la delincuencia de menor cuantía y descongestionar los despachos judiciales constituye una constante en la política criminal colombiana. Sin embargo, el desarrollo normativo en esta materia quedó marcado por un límite insalvable fijado por la jurisprudencia constitucional. Al evaluar el artículo 10 de la Ley 228 de 1995 —norma que pretendía procesar el hurto calificado menor a diez salarios mínimos legales mensuales vigentes bajo el trámite de una contravención especial—, la Corte Constitucional profirió la Sentencia C-364 de 1996, declarando dicho precepto inexequible.", "A través de dicho pronunciamiento, la Corte estableció una doctrina fundamental: la celeridad procesal no justifica despojar a la persona procesada de sus garantías fundamentales ni alterar el equilibrio propio del proceso penal. El análisis jurisprudencial censuró que la Ley 228 de 1995 mantuviera penas severas de privación de la libertad (de hasta ocho años de prisión) mientras, de forma simultánea, pues fusionaba en la figura del juez o jueza municipal las tareas de acusación y juzgamiento, suprimiendo el principio de separación de funciones limitando las oportunidades de contradicción y práctica de pruebas para la defensa y suprimiendo de cierta manera el acceso a mecanismos como la condena de ejecución condicional y la libertad provisional.", "Frente a este diseño regresivo, el tribunal constitucional fijó la regla que, si el legislador o considera que una determinada conducta delictiva amerita una represión penal severa, está constitucionalmente obligado a preservar la imparcialidad judicial y la plenitud de las formas propias del juicio oral y acusatorio.", "Dos décadas después de la Sentencia C-364 de 1996, el Congreso de la República expidió la Ley 1826 de 2017, la cual introdujo el procedimiento penal especial abreviado. Este nuevo instrumento redefinió el panorama político-criminal colombiano al asimilar y corregir los errores de diseño constitucional advertidos en la legislación de 1995. A diferencia del esquema invalidado en 1996, la Ley 1826 de 2017 busca racionalizar el flujo de las actuaciones procesales sin sacrificar las garantías fundamentales ni menoscabar la independencia de las autoridades judiciales.", "Así la Ley 1826 de 2017 mantiene intactas las competencias de los jueces de conocimiento y de los jueces de control de garantías. La agilidad del trámite no proviene de la supresión de la imparcialidad judicial, sino de la simplificación de ritos procesales formales.", "Específicamente, se elimina la audiencia oral de formulación de imputación y se sustituye por el traslado directo y por escrito del escrito de acusación a la defensa. Esta modificación reduce drásticamente las audiencias previas y optimiza los tiempos procesales, garantizando de manera efectiva el derecho de defensa y contradicción en consonancia con los mandatos constitucionales.", "El segundo pilar político-criminal introducido por la Ley 1826 de 2017 es la incorporación de la figura del acusador privado. Este mecanismo permite la conversión de la acción penal pública en privada, de modo que la víctima —representada por su abogado o abogada de confianza o por un consultorio jurídico— pueda asumir e impulsar directamente la persecución de conductas punibles de menor impacto social, tales como el hurto simple, la estafa o las lesiones personales culposas.", "La Fiscalía General de la Nación (FGN) conserva la titularidad preferente y constitucional de la acción penal, pero delega el rol de la acusación activa en el particular legítimamente facultado; la labor de investigación y acusación queda en manos de la víctima o su representante, mientras que la decisión judicial permanece atribuida en exclusiva a un tercero imparcial (el juez o jueza), y finalmente se impide la concentración de facultades acusatorias y decisorias en un mismo funcionario, erradicando los rasgos inquisitivos censurados en las reformas contravencionales del pasado.", "El procedimiento penal especial abreviado de la Ley 1826 de 2017 se ajusta al principio de proporcionalidad exigido por la doctrina constitucional colombiana al evitar la imposición de un régimen punitivo o procesal regresivo. Mientras que la normativa de 1995 castigaba procedimentalmente a la persona procesada cercenando beneficios sustanciales y libertades provisionales, la Ley 1826 de 2017 articula la celeridad del trámite con incentivos procesales y beneficios sustanciales amplios derivados de la aceptación temprana de cargos.", "En consecuencia, la reforma de 2017 demuestra que la celeridad procesal y la oralidad en el sistema acusatorio no deben configurarse como instrumentos de excepción o sanción procedimental. Por el contrario, se erigen en una fórmula legítima y constitucionalmente viable de descongestión judicial, capaz de armonizar la pronta administración de justicia con los límites infranqueables del debido proceso y la libertad personal."], "parrafo": [0, 3, 6, 8], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "encabezados": [], "rotulo": null, "bloques": [{"tipo": "rejilla", "items": [{"label": "Trámite procesal expedito", "segs": [0, 1], "obj": "reloj", "ilus": "terminos-reloj.webp"}, {"label": "Diseño regresivo", "segs": [2, 3, 4, 5], "obj": "documento", "ilus": "revisan-documento.webp"}, {"label": "Segundo pilar político-criminal", "segs": [6, 7], "obj": "personas", "ilus": "dialogo-carpeta.webp"}, {"label": "Principio de proporcionalidad", "segs": [8, 9], "obj": "escudo", "ilus": "fundamento-documento.webp"}]}], "mediacion": "Rejilla en collage: cada recuadro abre su texto completo.", "rotulos": ["Trámite procesal expedito", "Diseño regresivo", "Segundo pilar político-criminal", "Principio de proporcionalidad"], "titulo_genially": "Razones político-criminales", "guia": "Haga clic en cada recuadro para leer su texto completo."}], "juego": {"clave": "l1826-juego-u1-l1", "niveles": ["Observador", "Analista", "Fiscal del abreviado", "Referente en el procedimiento abreviado"]}, "marco": [1113, 448]}</script>
