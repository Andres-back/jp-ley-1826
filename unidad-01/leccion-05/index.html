cedibilidad", "scenes": [{"layout": "pestanas", "pestanas": [{"layout": "lamina", "segmentos": ["Objetivo de la lección: Analizar e identificar la querella y la conciliación preprocesal como barreras y presupuestos obligatorios de procedibilidad en el procedimiento penal especial abreviado (Ley 1826 de 2017), así como verificar los términos de caducidad y los efectos jurídicos del intento de acuerdo en los delitos del grupo I (querellables), para evitar la indebida exigencia de estos requisitos o la aplicación errónea de la caducidad en los delitos investigables de oficio del grupo II."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Objetivo de la lección", "segs": [0], "obj": "libros", "acomp": ["reloj", "escalones"]}]}], "rotulo": null, "seccion": "Lección 5. Querella y conciliación como requisitos de procedibilidad", "grupo": null, "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Objetivo de la lección"], "titulo_genially": "Querella y conciliación como requisitos de procedibilidad", "ilustracion": "p-alto-documento-2.webp", "relleno": "revisan-documento.webp", "arte": {"img": "p-alto-documento-2.webp", "pos": "izq"}, "pestana": "Objetivo de la lección"}, {"layout": "lamina", "segmentos": ["Para los delitos del grupo I (querellables), el legislador ha impuesto dos barreras procedimentales que quien ejerce como fiscal debe verificar rigurosamente antes de realizar cualquier acto de vinculación procesal: la caducidad de la querella y el requisito de procedibilidad de la conciliación previa."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "dos barreras procedimentales", "segs": [0], "obj": "escalones", "acomp": ["documento", "carpetas"]}]}], "rotulo": null, "seccion": "Introducción", "grupo": null, "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["dos barreras procedimentales"], "titulo_genially": "Introducción", "ilustracion": "p-alto-documento.webp", "relleno": "revisan-documento.webp", "pestana": "Introducción"}], "segmentos": [], "parrafo": [], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [], "rotulo": null, "seccion": "Lección 5. Querella y conciliación como requisitos de procedibilidad", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Pestañas: lamina, lamina", "rotulos": ["Objetivo de la lección", "Introducción"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "", "guia": "Recorra cada pestaña en orden: cada una es una parte de esta diapositiva."}, {"layout": "esquema", "segmentos": ["De conformidad con el artículo 73 del Código de Procedimiento Penal, la querella debe presentarse dentro de los seis (6) meses siguientes a la comisión de la conducta punible. No obstante, cuando el querellante legítimo no hubiere tenido conocimiento de su ocurrencia por razones de fuerza mayor o caso fortuito debidamente acreditadas, el término comenzará a contarse a partir del momento en que desaparezcan dichas circunstancias, sin que pueda superar los seis (6) meses.", "La presentación extemporánea de la querella, una vez configurada su caducidad, constituye una causal de extinción de la acción penal, conforme al artículo 77 del Código de Procedimiento Penal. En consecuencia, cuando la Fiscalía advierta que ha operado este fenómeno jurídico, deberá solicitar al juez de conocimiento la preclusión de la actuación, con fundamento en la causal primera del artículo 332 del mismo estatuto, relativa a la imposibilidad de iniciar o continuar el ejercicio de la acción penal por la configuración de una causal de extinción.", "Esta solicitud de preclusión procede en cualquier momento de la actuación procesal, incluso antes de la formulación de imputación, de conformidad con el artículo 331 del Código de Procedimiento Penal. Por tanto, la Fiscalía no puede disponer unilateralmente el archivo de las diligencias con fundamento en la caducidad de la querella, sino que debe someter dicha situación al pronunciamiento del juez competente.", "En consecuencia, adelantar o mantener un trámite penal, incluido el procedimiento especial abreviado, pese a encontrarse acreditada la caducidad de la querella, desconoce los presupuestos legales para el ejercicio de la acción penal y puede comprometer la validez de la actuación."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Artículo 73 del Código de Procedimiento Penal", "segs": [0], "obj": "reloj"}, {"label": "La presentación extemporánea de la querella", "segs": [1, 2, 3], "obj": "puertaCerrada"}]}], "rotulo": null, "seccion": "1. Caducidad de la querella", "grupo": null, "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Artículo 73 del Código de Procedimiento Penal", "La presentación extemporánea de la querella"], "titulo_genially": "Caducidad de la querella", "ilustracion": "corren-carpetas.webp", "relleno": "dialogo-carpeta.webp", "arte": {"img": "corren-carpetas.webp", "pos": "fondo"}, "escenario": {"bioma": "fiscalia", "camino": "meandro"}, "guia": "Recorra el camino: elija cada parada y lea su contenido."}, {"layout": "rejilla", "segmentos": ["Para los delitos querellables, la ley exige agotar un intento de conciliación entre la víctima y el indiciado antes de proceder al traslado del escrito de acusación. Este trámite se rige por las siguientes pautas institucionales:", "a) Citación a conciliación: la Fiscalía, o un centro de conciliación autorizado (público o privado), debe citar a las partes a audiencia formal de conciliación.", "b) Resultado favorable (acuerdo): si las partes llegan a un acuerdo conciliatorio y este se cumple se suscribe el acta respectiva. Esto da lugar a la extinción de la acción penal y el consecuente archivo definitivo de las diligencias.", "c) Resultado desfavorable (no acuerdo o inasistencia): si las partes asisten, pero no concilian, o si alguna de ellas no asiste injustificadamente tras ser debidamente citada, quien ejerce como fiscal o conciliador dejará constancia de ello en un acta de no acuerdo o inasistencia, según corresponda. Este documento perfecciona la condición de procedibilidad, habilitando formalmente a la Fiscalía para proceder al traslado del escrito de acusación.", "Alerta: La caducidad de la querella, regulada en el artículo 73 del Código de Procedimiento Penal, y el requisito de procedibilidad de conciliación preprocesal, previsto en el artículo 522 del mismo estatuto, son exigibles, como regla general, respecto de las conductas punibles que requieren querella conforme al artículo 74 del CPP. La querella debe formularse dentro de los seis (6) meses siguientes a la comisión de la conducta punible. Excepcionalmente, cuando el querellante legítimo, por razones de fuerza mayor o caso fortuito debidamente acreditadas, no hubiere tenido conocimiento de su ocurrencia, el término comenzará a contabilizarse desde el momento en que desaparezcan dichas circunstancias, sin que pueda superar los seis (6) meses.", "Adicionalmente, el parágrafo del artículo 74 del CPP establece que no será necesaria la querella para iniciar la acción penal en los casos de flagrancia, cuando el sujeto pasivo sea menor de edad o inimputable, o cuando se trate de presuntas conductas punibles de violencia contra la mujer. En estos eventos, al no ser exigible la querella como condición de procesabilidad, tampoco opera su caducidad como presupuesto para iniciar la acción penal.", "Por el contrario, las conductas punibles de investigación oficiosa comprendidas en el catálogo del artículo 534 del CPP, como la violencia intrafamiliar y la inasistencia alimentaria, no están sometidas, por su naturaleza, al término de caducidad de la querella ni al requisito de conciliación preprocesal. En consecuencia, su persecución penal se rige por las reglas generales de procedibilidad y por los términos de prescripción de la acción penal establecidos en la Ley 599 de 2000."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "rejilla", "items": [{"label": "intento de conciliación entre la víctima", "segs": [0, 1], "obj": "escudo"}, {"label": "Resultado favorable (acuerdo)", "segs": [2], "obj": "carpetas"}, {"label": "Resultado desfavorable (no acuerdo o inasistencia)", "segs": [3], "obj": "documento"}, {"label": "Alerta", "segs": [4, 5, 6], "obj": "lupa", "alerta": true}]}], "rotulo": null, "seccion": "2. Conciliación como requisito de procedibilidad", "grupo": null, "encabezados": [], "mediacion": "Rejilla en collage: ventanas con ilustración que llenan el marco; cada una abre su texto completo.", "rotulos": ["intento de conciliación entre la víctima", "Resultado favorable (acuerdo)", "Resultado desfavorable (no acuerdo o inasistencia)", "Alerta"], "titulo_genially": "Conciliación como requisito de procedibilidad", "ilustracion": "trio-dialogo.webp", "relleno": "corren-carpetas.webp", "arte": {"img": "trio-dialogo.webp", "pos": "fondo"}}, {"layout": "esquema", "segmentos": ["Según la práctica judicial, la redacción de la acusación es plasmar la teoría del delito en el caso concreto. Por esta razón, para las etapas iniciales del procedimiento penal abreviado son frecuentes los errores de apreciación jurídica por parte de los operadores judiciales. A continuación, se detallan los errores más comunes identificados en las fiscalías delegadas y sus consecuencias procesales:", "a) Tramitar bajo el procedimiento especial abreviado un concurso de conductas punibles sometidas a procedimientos distintos: Se presenta cuando quien ejerce como fiscal adelanta el procedimiento especial abreviado respecto de una conducta punible incluida en el catálogo del artículo 534 de la Ley 906 de 2004, sin advertir que concurre con otra conducta cuyo trámite corresponde al procedimiento ordinario. Por ejemplo, cuando se investigan conjuntamente un hurto calificado y agravado (artículos 240 y 241 del Código Penal) y una conducta de fabricación, tráfico o porte de armas de fuego (artículo 365 del Código Penal).", "En estos casos, el inciso segundo del artículo 534 del Código de Procedimiento Penal establece expresamente que la actuación debe regirse por el procedimiento ordinario. Por consiguiente, tramitar la totalidad de la actuación mediante el procedimiento especial abreviado desconoce la regla legal de determinación del procedimiento aplicable y puede generar una irregularidad procesal que deberá ser examinada conforme a las reglas sobre nulidades, atendiendo a su trascendencia y a la afectación de las garantías procesales. Si se declara la nulidad, el juez deberá determinar los actos afectados y el momento procesal al que debe retrotraerse la actuación, sin que ello implique necesariamente invalidar todo lo actuado.", "b) Aplicar la caducidad de la querella a delitos de oficio del catálogo abreviado: es un error interpretativo muy recurrente en el que se confunde procedimiento abreviado con procedimiento querellable. Consiste en ordenar el archivo, por ejemplo, de una investigación por VIF o inasistencia alimentaria bajo el argumento de que la denuncia se presentó después de transcurridos seis meses desde la ocurrencia de los hechos.", "Se incurre en denegación de justicia y prevaricato por acción. Se archiva de forma manifiestamente ilegal una conducta de oficio de alta sensibilidad social, vulnerando gravemente los derechos de las víctimas y la política criminal del Estado.", "c) Trasladar el escrito de acusación sin agotar la conciliación en delitos querellables: Consiste en adelantar el procedimiento especial abreviado respecto de una conducta punible que requiere querella, sin haber agotado previamente la conciliación preprocesal exigida por el artículo 522 de la Ley 906 de 2004.", "Por ejemplo, en investigaciones por lesiones personales querellables o daño en bien ajeno que reúna las condiciones legales para requerir querella, quien ejerce como fiscal debe verificar que las partes hayan sido citadas a la diligencia de conciliación y que esta se haya realizado sin que se alcanzara un acuerdo que dé lugar a la terminación de la actuación.", "El cumplimiento de este requisito debe acreditarse mediante el acta o la constancia expedida por el fiscal, centro de conciliación o conciliador competente, en la que se documente el resultado de la diligencia, la ausencia de acuerdo o las circunstancias de inasistencia de las partes, según corresponda. Dicho soporte debe incorporarse a la actuación y acompañar la presentación del escrito de acusación ante el juez competente.", "Esta verificación debe efectuarse antes del traslado del escrito de acusación, pues la conciliación preprocesal constituye un requisito de procedibilidad para el ejercicio de la acción penal en los delitos querellables. Su omisión puede generar cuestionamientos sobre la validez de la actuación y dar lugar a las decisiones procesales correspondientes, incluida la eventual declaratoria de nulidad, siempre que se acrediten los presupuestos legales para ello. En consecuencia, el juez de conocimiento debe verificar, al examinar la acusación y las condiciones de procedibilidad, que exista soporte del agotamiento de este requisito legal.", "d) Confundir los HJR con hechos de la denuncia, hechos de la prueba o hechos indicadores:", "Ocurre cuando quien elabora el escrito de acusación, en lugar de identificar y describir de manera clara, concreta y sucinta las circunstancias fácticas que configuran la conducta punible atribuida al procesado, transcribe íntegramente la denuncia, las entrevistas o los informes de policía judicial en el acápite de hechos jurídicamente relevantes.", "Esta práctica desconoce la necesidad de diferenciar tres categorías: (i) los hechos jurídicamente relevantes, que corresponden a los supuestos fácticos que encajan en la descripción legal del delito; (ii) los hechos indicadores, entendidos como aquellas circunstancias conocidas a partir de las cuales pueden inferirse los hechos jurídicamente relevantes; y (iii) los medios de prueba, que comprenden los testimonios, documentos, evidencias físicas y demás elementos destinados a demostrar los hechos objeto de la acusación.", "Por ejemplo, en una investigación por hurto, constituye un hecho jurídicamente relevante afirmar que el acusado se apoderó, sin autorización de su propietario y con intención de obtener un provecho económico, de un teléfono celular ajeno. En cambio, señalar que el acusado salió apresuradamente del establecimiento después de la desaparición del dispositivo constituye un hecho indicador que puede contribuir a inferir su participación en la conducta. Por su parte, la grabación de las cámaras de seguridad, el testimonio de quien presenció los hechos y el informe de policía judicial constituyen medios de prueba mediante los cuales se pretende acreditar las circunstancias investigadas.", "En consecuencia, el escrito de acusación debe presentar los hechos jurídicamente relevantes en un acápite independiente, sin sustituirlos por la narración de los elementos probatorios ni por una enumeración desarticulada de circunstancias indicadoras. Los hechos indicadores y los medios de prueba deben tener su correspondiente tratamiento en los apartados destinados al descubrimiento y la relación de los elementos materiales probatorios, evidencia física e información legalmente obtenida.", "La confusión entre estas categorías puede generar observaciones por falta de claridad y precisión en la formulación de los cargos, afectar el ejercicio del derecho de defensa y dificultar la delimitación del tema de prueba. Asimismo, si la acusación no determina adecuadamente los hechos que delimitan la responsabilidad penal atribuida, puede comprometerse el principio de congruencia y la posibilidad de emitir una sentencia condenatoria sustentada en los hechos efectivamente acusados."], "parrafo": [0, 1, 2, 3, 5, 7, 8, 9, 11, 12, 13, 14], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "redacción de la acusación", "segs": [0], "obj": "escalones"}, {"label": "Tramitar bajo el procedimiento especial abreviado", "segs": [1, 2], "obj": "libros"}, {"label": "Aplicar la caducidad de la querella", "segs": [3, 4], "obj": "lupa"}, {"label": "Trasladar el escrito de acusación sin agotar", "segs": [5, 6, 7, 8], "obj": "reloj"}, {"label": "Confundir los HJR con hechos", "segs": [9, 10, 11, 12, 13, 14], "obj": "expediente"}]}], "rotulo": null, "seccion": "3. Para tener en cuenta: errores frecuentes de tipificación que llevan a rutas procesales inadecuadas", "grupo": null, "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["redacción de la acusación", "Tramitar bajo el procedimiento especial abreviado", "Aplicar la caducidad de la querella", "Trasladar el escrito de acusación sin agotar", "Confundir los HJR con hechos"], "titulo_genially": "Para tener en cuenta: errores frecuentes de tipificación que llevan a rutas procesales inadecuadas", "ilustracion": "p-dialogo-carpeta-2.webp", "relleno": "explica-brazos.webp", "arte": {"img": "p-dialogo-carpeta-2.webp", "pos": "izq"}, "escenario": {"bioma": "centro", "camino": "asciende"}, "guia": "Recorra el camino: elija cada parada y lea su contenido."}, {"layout": "pestanas", "pestanas": [{"layout": "actividad", "segmentos": ["(Verdadero o falso)", "Pregunta de control 1: solución de concursos de delitos", "¿Cómo debe actuar el fiscal cuando en una misma hipótesis fáctica concurren un delito del catálogo abreviado (por ejemplo, hurto calificado) y un delito del procedimiento ordinario (por ejemplo, porte ilegal de armas de fuego)?", "Respuesta / solución: Debe tramitar la totalidad de la actuación procesal bajo las reglas del procedimiento ordinario de la Ley 906 de 2004.", "Verdadero", "Fundamentación: Aplica la regla de prevalencia del procedimiento ordinario (art. 534, inciso 2 del CPP). La ley prohíbe la fragmentación de la investigación. Si el fiscal procesa un concurso mixto por la vía abreviada, actúa sin competencia funcional. Esto vicia de nulidad absoluta lo actuado a partir del traslado del escrito de acusación (art. 457 del CPP)."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "actividad", "modo": "preguntas", "intro": [], "preguntas": [{"contexto": [], "cab": 1, "linea_opciones": false, "caption": 0, "enunciado": [2], "respuesta": 4, "retro": [3, 5], "fuente": [], "opciones": [{"texto": "Verdadero", "letra": "A", "ok": true}, {"texto": "Falso", "letra": "B", "ok": false}]}], "items": [{"label": "Pregunta de control 1", "segs": [0, 1, 2, 3, 4, 5], "obj": "documento"}], "cierre": []}], "rotulo": null, "seccion": "Preguntas de control", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Actividad con retroalimentación: se elige una opción; si no es la correcta, se lee la retroalimentación y se vuelve a intentar; la correcta deja pasar a la siguiente.", "rotulos": ["Pregunta de control 1: solución de concursos de delitos"], "titulo_genially": "Actividad práctica: solución de concursos de delitos", "complemento_genially": "", "apartado": "Preguntas de control", "relleno": "sustentacion-audiencia.webp", "guia": "Elija «Verdadero» o «Falso».", "controlU1": 1, "pestana": "Solución de concursos de delitos"}, {"layout": "actividad", "segmentos": ["Pregunta de control 2: requisitos de procedibilidad y su ámbito material", "¿Cuáles son los requisitos de procedibilidad en el procedimiento abreviado y a qué categoría de delitos aplican de manera exclusiva?", "Respuesta / solución: Los requisitos son la caducidad de la querella (término perentorio de seis meses desde la comisión del hecho, art. 73 del CPP) y la conciliación preprocesal obligatoria (art. 522 del CPP). Aplican única y exclusivamente a los delitos querellables del grupo I (art. 74 del CPP).", "Verdadero", "Fundamentación: Estos requisitos no aplican a los delitos investigables de oficio del catálogo del artículo 534 numeral 2 (grupo II, como VIF o inasistencia alimentaria). Archivar una investigación de oficio alegando el paso de seis meses o exigir conciliación previa en estos delitos constituye un error grave de tipificación e ilegalidad procesal."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "actividad", "modo": "preguntas", "intro": [], "preguntas": [{"contexto": [], "cab": 0, "linea_opciones": false, "caption": null, "enunciado": [1], "respuesta": 3, "retro": [2, 4], "fuente": [], "opciones": [{"texto": "Verdadero", "letra": "A", "ok": true}, {"texto": "Falso", "letra": "B", "ok": false}]}], "items": [{"label": "Pregunta de control 2", "segs": [0, 1, 2, 3, 4], "obj": "documento"}], "cierre": []}], "rotulo": null, "seccion": "Preguntas de control", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Actividad con retroalimentación: se elige una opción; si no es la correcta, se lee la retroalimentación y se vuelve a intentar; la correcta deja pasar a la siguiente.", "rotulos": ["Pregunta de control 2: requisitos de procedibilidad y su ámbito material"], "titulo_genially": "Actividad práctica: requisitos de procedibilidad y su ámbito material", "complemento_genially": "", "apartado": "Preguntas de control", "relleno": "fundamento-documento.webp", "guia": "Elija «Verdadero» o «Falso».", "controlU1": 2, "pestana": "Requisitos de procedibilidad y su ámbito material"}, {"layout": "actividad", "segmentos": ["Pregunta de control 3: efectos sustanciales del traslado de la acusación", "Al eliminarse la audiencia oral de formulación de imputación ante juez de control de garantías, ¿qué acto procesal la sustituye y qué efectos jurídicos produce?", "Respuesta / solución: Lo sustituye el traslado directo del escrito de acusación (art. 536 del CPP) que realiza el o la fiscal a la persona indiciada y a su defensor.", "Verdadero", "Fundamentación: Este acto de comunicación surte formal y materialmente los mismos efectos jurídicos que la formulación de imputación, pues: a) vincula formalmente al procesado a la relación jurídico-procesal, b) interrumpe el término de prescripción de la acción penal, y 3) activa el derecho de defensa y abre un término obligatorio de 60 días calendario para que la defensa técnica prepare su caso antes de la audiencia concentrada."], "parrafo": [0, 1, 2, 3, 4], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "actividad", "modo": "preguntas", "intro": [], "preguntas": [{"contexto": [], "cab": 0, "linea_opciones": false, "caption": null, "enunciado": [1], "respuesta": 3, "retro": [2, 4], "fuente": [], "opciones": [{"texto": "Verdadero", "letra": "A", "ok": true}, {"texto": "Falso", "letra": "B", "ok": false}]}], "items": [{"label": "Pregunta de control 3", "segs": [0, 1, 2, 3, 4], "obj": "documento"}], "cierre": []}], "rotulo": null, "seccion": "Preguntas de control", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Actividad con retroalimentación: se elige una opción; si no es la correcta, se lee la retroalimentación y se vuelve a intentar; la correcta deja pasar a la siguiente.", "rotulos": ["Pregunta de control 3: efectos sustanciales del traslado de la acusación"], "titulo_genially": "Actividad práctica: efectos sustanciales del traslado de la acusación", "complemento_genially": "", "apartado": "Preguntas de control", "relleno": "lee-libro-explica.webp", "guia": "Elija «Verdadero» o «Falso».", "controlU1": 3, "pestana": "Efectos sustanciales del traslado de la acusación"}], "segmentos": [], "parrafo": [], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [], "rotulo": null, "seccion": "Preguntas de control", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Pestañas: actividad, actividad, actividad", "rotulos": ["Solución de concursos de delitos", "Requisitos de procedibilidad y su ámbito material", "Efectos sustanciales del traslado de la acusación"], "titulo_genially": "Actividad práctica", "complemento_genially": "", "apartado": "Preguntas de control", "guia": "Recorra cada pestaña en orden: cada una es una parte de esta diapositiva."}, {"layout": "fichas", "segmentos": ["Estudio reverso de caso 1: escrito de acusación flagrancia y nulidad", "Hechos: El 15 de agosto de 2023, en el barrio Industrial de la ciudad de Cali, el supervisor de zona Jorge Eliécer Benavides sorprendió a Mario Alberto Gómez Parra (contratista activo de la distribuidora) y a Pedro Antonio Morales Rincón (extransportador) realizando el transbordo clandestino de 45 botellas con etiquetas de la marca protegida Kombucha Valle desde un vehículo particular (Placa KTH412) hacia el camión repartidor oficial de la compañía (Placa WXN445).", "Al inspeccionar los envases, el supervisor constató que etiquetas y las tapas no correspondían a los estándares originales de la fábrica. Asimismo, el supervisor venía haciendo seguimiento a la zona de distribución a cargo de Mario Alberto, debido a una caída atípica e injustificada en las ventas durante los meses anteriores. Sobre el hallazgo grabó un video de las botellas con su celular.", "La investigación se adelantó sin captura, se tomaron entrevistas al personal de seguridad y recopilándose informes técnicos e investigaciones internas de la empresa en 2023. El escrito de acusación se radicó bajo las reglas del procedimiento penal especial abreviado (Ley 1826 de 2017) el 4 de febrero de 2026. Para tener en cuenta:", "Módulo 1: Redacción de Hechos Jurídicamente Relevantes (HJR) y Verbos Rectores. Problema: El fiscal copió en la acusación la totalidad de los verbos rectores del artículo 306 del C.P. (\"suministrar, distribuir, transportar o adquirir\") imputándolos por igual a dos procesados.", "Solución: Individualizar los roles fácticos: Pedro Antonio (extransportador) suministró y transportó el producto alterado en vehículo particular; Mario Alberto (contratista activo) adquirió y distribuyó en la red oficial. La agravante del numeral 7° del Art. 58 C.P. (quebrantamiento de deberes contractuales) se atribuye únicamente a Mario Alberto."], "parrafo": [0, 1, 2, 3, 4, 5], "vineta": [], "lead": [], "titulo": [0], "tail": [], "chips": [], "bloques": [{"tipo": "fichas", "items": [{"label": "Hechos", "segs": [1, 2, 3], "obj": "personas"}, {"label": "Módulo 1: problema", "segs": [4], "obj": "documento"}, {"label": "Solución", "segs": [5], "obj": "balanza"}]}], "rotulo": null, "seccion": "Caso de análisis 7: Redacción de HJR y verbos rectores", "grupo": null, "titulos_fuente": ["Estudio reverso de caso 1: escrito de acusación flagrancia y nulidad"], "encabezados": [], "mediacion": "Caso en fichas: cada parte del expediente en su pestaña, con su texto en el panel.", "rotulos": ["Hechos", "Módulo 1: problema", "Solución"], "titulo_genially": "Caso de análisis 7: Redacción de HJR y verbos rectores", "complemento_genially": "", "apartado": "Caso de análisis 7: Redacción de HJR y verbos rectores", "ilustracion": "alto-documento.webp", "relleno": "fundamento-documento.webp", "guia": "Elija cada parte del expediente y lea su texto en el panel.", "casoU1": "7-p125"}], "juego": {"clave": "l1826-juego-u1-l5", "niveles": ["Observador", "Analista", "Fiscal del abreviado", "Referente en el procedimiento abreviado"]}, "marco": [1113, 448], "paginaLamina": 740, "claveVentana": 300, "tablaVentana": true}</script>
