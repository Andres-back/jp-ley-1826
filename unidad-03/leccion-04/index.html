lementos materiales probatorios, la evidencia física y la información legalmente obtenida que repose en los archivos físicos y digitales de la FGN en relación con ese radicado.", "Esta entrega debe documentarse formalmente mediante un acta de traslado, en la cual se individualice cada elemento material probatorio o evidencia física, se relacionen los respectivos formatos de cadena de custodia y se describan las condiciones en que se encuentran al momento de su entrega. Una vez suscrita el acta y realizada la entrega material, el acusador privado asume las obligaciones de custodia, conservación y preservación de la integridad de los elementos recibidos, de conformidad con las reglas legales aplicables, dejando constancia de cualquier novedad que pueda afectar su autenticidad o estado de conservación."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}], "items": [{"label": "1. Traslado de custodia de elementos materiales probatorios y evidencia física (art. 559 del CPP)", "segs": [0, 1], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["expediente", "personas", "lupa"]}], "rotulo": null, "seccion": "1. Traslado de custodia de elementos materiales probatorios y evidencia física (art. 559 del CPP)", "grupo": null, "titulos_fuente": ["1. Traslado de custodia de elementos materiales probatorios y evidencia física (art. 559 del CPP)"], "encabezados": [], "mediacion": "Página compacta: lectura en una columna", "rotulos": ["1. Traslado de custodia de elementos materiales probatorios y evidencia física (art. 559 del CPP)"], "titulo_genially": "1. Traslado de custodia de elementos materiales probatorios y evidencia física (art. 559 del CPP)", "complemento_genially": "", "apartado": "1. Traslado de custodia de elementos materiales probatorios y evidencia física (art. 559 del CPP)",
