, la calumnia, el abuso de confianza o el daño en bien ajeno de cuantía ordinaria. Adicionalmente, los delitos de oficio seleccionados, entre los que destacan las lesiones personales sin secuelas permanentes, la inasistencia alimentaria, la estafa ordinaria, el hurto simple y agravado (numerales 1 al 10 del art. 241), los actos de discriminación, el hostigamiento agravado, la falsedad en documento privado y los delitos contra los derechos de autor."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}], "items": [{"label": "2. Ámbito de aplicación material (catálogo del artículo 534 del CPP)", "segs": [0], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["telefono", "documento", "personas"]}], "rotulo": null, "seccion": "2. Ámbito de aplicación material (catálogo del artículo 534 del CPP)", "grupo": null, "titulos_fuente": ["2. Ámbito de aplicación material (catálogo del artículo 534 del CPP)"], "encabezados": [], "mediacion": "Página compacta: lectura en una columna", "rotulos": ["2. Ámbito de aplicación material (catálogo del artículo 534 del CPP)"], "titulo_genially": "2. Ámbito de aplicación material (catálogo del artículo 534 del CPP)", "complemento_genially": "", "apartado": "2. Ámbito de aplicación material (catálogo del artículo 534 del CPP)", "bloques_fuente": [23, 24], "guia": "Lea el contenido; si continúa, baje con la barra de desplazamiento para verlo completo.", "ilustracion": "dialogo-carpeta.webp"}]}</script>
